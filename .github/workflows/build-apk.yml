name: Build Connect Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q "connect-chat-v11-github-upload-ready-fixed.zip" -d /tmp/connect-chat
          rm -rf android
          cp -r /tmp/connect-chat/android .

      - name: Add AndroidX WebView dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          dependency = "implementation 'androidx.webkit:webkit:1.12.1'"

          if dependency not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    " + dependency,
                      1
                  )
              else:
                  text += (
                      "\n\ndependencies {\n"
                      "    " + dependency + "\n"
                      "}\n"
                  )

          path.write_text(text)
          PY

      - name: Fix Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = path.read_text()

          permission = (
              '    <uses-permission '
              'android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          )

          if "android.permission.MODIFY_AUDIO_SETTINGS" not in text:
              marker = (
                  '    <uses-permission '
                  'android:name="android.permission.RECORD_AUDIO" />'
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + permission,
                      1
                  )
              else:
                  text = text.replace(
                      "<application",
                      permission + "\n    <application",
                      1
                  )

          path.write_text(text)
          PY

      - name: Create MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/connectchat/app

          cat > android/app/src/main/java/com/connectchat/app/MainActivity.java <<'JAVA'
          package com.connectchat.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private WebView webView;
              private WebViewAssetLoader assetLoader;

              private ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingPermissionRequest;

              private static final int FILE_PICKER_REQUEST = 1001;
              private static final int MEDIA_PERMISSION_REQUEST = 1002;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  assetLoader =
                          new WebViewAssetLoader.Builder()
                                  .addPathHandler(
                                          "/assets/",
                                          new WebViewAssetLoader
                                                  .AssetsPathHandler(this)
                                  )
                                  .build();

                  webView = new WebView(this);

                  webView.setBackgroundColor(
                          Color.rgb(11, 11, 15)
                  );

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(
                          new WebViewClient() {

                              @Override
                              public WebResourceResponse
                              shouldInterceptRequest(
                                      WebView view,
                                      WebResourceRequest request) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  request.getUrl()
                                          );
                              }

                              @Override
                              public WebResourceResponse
                              shouldInterceptRequest(
                                      WebView view,
                                      String url) {

                                  return assetLoader
                                          .shouldInterceptRequest(
                                                  Uri.parse(url)
                                          );
                              }
                          }
                  );

                  webView.setWebChromeClient(
                          new WebChromeClient() {

                              @Override
                              public boolean onShowFileChooser(
                                      WebView webView,
                                      ValueCallback<Uri[]> callback,
                                      FileChooserParams params) {

                                  if (fileCallback != null) {
                                      fileCallback.onReceiveValue(null);
                                  }

                                  fileCallback = callback;

                                  Intent intent =
                                          new Intent(
                                                  Intent.ACTION_OPEN_DOCUMENT
                                          );

                                  intent.addCategory(
                                          Intent.CATEGORY_OPENABLE
                                  );

                                  intent.setType("*/*");

                                  intent.putExtra(
                                          Intent.EXTRA_MIME_TYPES,
                                          new String[]{
                                                  "image/*",
                                                  "video/*"
                                          }
                                  );

                                  intent.putExtra(
                                          Intent.EXTRA_ALLOW_MULTIPLE,
                                          false
                                  );

                                  try {
                                      startActivityForResult(
                                              Intent.createChooser(
                                                      intent,
                                                      "Select photo or video"
                                              ),
                                              FILE_PICKER_REQUEST
                                      );

                                      return true;

                                  } catch (Exception error) {
                                      fileCallback = null;
                                      return false;
                                  }
                              }

                              @Override
                              public void onPermissionRequest(
                                      final PermissionRequest request) {

                                  runOnUiThread(
                                          () -> {

                                              boolean needsCamera = false;
                                              boolean needsMicrophone = false;

                                              for (
                                                      String resource :
                                                      request.getResources()
                                              ) {

                                                  if (
                                                          PermissionRequest
                                                                  .RESOURCE_VIDEO_CAPTURE
                                                                  .equals(resource)
                                                  ) {
                                                      needsCamera = true;
                                                  }

                                                  if (
                                                          PermissionRequest
                                                                  .RESOURCE_AUDIO_CAPTURE
                                                                  .equals(resource)
                                                  ) {
                                                      needsMicrophone = true;
                                                  }
                                              }

                                              ArrayList<String>
                                                      permissions =
                                                      new ArrayList<>();

                                              if (
                                                      needsCamera &&
                                                      checkSelfPermission(
                                                              Manifest.permission.CAMERA
                                                      ) != PackageManager.PERMISSION_GRANTED
                                              ) {
                                                  permissions.add(
                                                          Manifest.permission.CAMERA
                                                  );
                                              }

                                              if (
                                                      needsMicrophone &&
                                                      checkSelfPermission(
                                                              Manifest.permission.RECORD_AUDIO
                                                      ) != PackageManager.PERMISSION_GRANTED
                                              ) {
                                                  permissions.add(
                                                          Manifest.permission.RECORD_AUDIO
                                                  );
                                              }

                                              if (!permissions.isEmpty()) {

                                                  pendingPermissionRequest =
                                                          request;

                                                  requestPermissions(
                                                          permissions.toArray(
                                                                  new String[0]
                                                          ),
                                                          MEDIA_PERMISSION_REQUEST
                                                  );

                                                  return;
                                              }

                                              request.grant(
                                                      request.getResources()
                                              );
                                          }
                                  );
                              }
                          }
                  );

                  webView.loadUrl(
                          "https://appassets.androidplatform.net/assets/www/index.html"
                  );
              }
                            @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (requestCode != FILE_PICKER_REQUEST) {
                      return;
                  }

                  if (fileCallback == null) {
                      return;
                  }

                  Uri[] results = null;

                  if (resultCode == RESULT_OK && data != null) {

                      if (
                              data.getClipData() != null &&
                              data.getClipData().getItemCount() > 0
                      ) {

                          results = new Uri[]{
                                  data.getClipData()
                                          .getItemAt(0)
                                          .getUri()
                          };

                      } else if (data.getData() != null) {

                          results = new Uri[]{
                                  data.getData()
                          };
                      }
                  }

                  fileCallback.onReceiveValue(results);
                  fileCallback = null;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (
                          requestCode != MEDIA_PERMISSION_REQUEST ||
                          pendingPermissionRequest == null
                  ) {
                      return;
                  }

                  boolean granted = true;

                  for (int result : grantResults) {

                      if (
                              result != PackageManager.PERMISSION_GRANTED
                      ) {
                          granted = false;
                          break;
                      }
                  }

                  if (granted) {

                      pendingPermissionRequest.grant(
                              pendingPermissionRequest.getResources()
                      );

                  } else {

                      pendingPermissionRequest.deny();
                  }

                  pendingPermissionRequest = null;
              }

              @Override
              public void onBackPressed() {

                  if (
                          webView != null &&
                          webView.canGoBack()
                  ) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {
                      webView.stopLoading();
                      webView.destroy();
                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          JAVA

      - name: Fix Connect Chat theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/res/values/themes.xml"
          )

          text = path.read_text()

          if 'name="Theme.ConnectChat"' not in text:
              text = text.replace(
                  "</resources>",
                  '    <style name="Theme.ConnectChat" parent="AppTheme" />\n</resources>',
                  1
              )
              path.write_text(text)
          PY

      - name: Patch media handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/assets/www/app.js"
          )

          text = path.read_text()

          old = """async function getMedia(type){
          return navigator.mediaDevices.getUserMedia({
            video:type==='video'?{facingMode:'user',width:{ideal:1280},height:{ideal:720}}:false,
            audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
          });
          }"""

          new = """async function getMedia(type){
          if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
            throw new Error('Media access is not supported on this device.');
          }

          const wantVideo = type === 'video';

          return await navigator.mediaDevices.getUserMedia({
            video: wantVideo ? {
              facingMode:'user',
              width:{ideal:1280},
              height:{ideal:720}
            } : false,
            audio: {
              echoCancellation:true,
              noiseSuppression:true,
              autoGainControl:true
            }
          });
          }"""

          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
                - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-chat-fixed-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
