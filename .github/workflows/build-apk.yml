name: Build Connect Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q "connect-chat-v11-github-upload-ready-fixed.zip" -d /tmp/cc
          rm -rf android
          cp -r /tmp/cc/android .

      - name: Create MainActivity
        run: |
          mkdir -p android/app/src/main/java/com/connectchat/app

          cat > android/app/src/main/java/com/connectchat/app/MainActivity.java <<'JAVA'
          package com.connectchat.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;
              private android.webkit.ValueCallback<Uri[]> fileCallback;
              private PermissionRequest pendingRequest;

              private static final int FILE_PICKER = 1001;
              private static final int MEDIA_PERMISSION = 1002;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  try {
                      web = new WebView(this);
                      web.setBackgroundColor(
                          android.graphics.Color.rgb(11, 11, 15)
                      );
                      setContentView(web);

                      WebSettings settings = web.getSettings();

                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setAllowFileAccess(true);
                      settings.setAllowContentAccess(true);
                      settings.setMediaPlaybackRequiresUserGesture(false);

                      web.setWebViewClient(new WebViewClient());

                      web.setWebChromeClient(new WebChromeClient() {

                          @Override
                          public boolean onShowFileChooser(
                                  WebView view,
                                  android.webkit.ValueCallback<Uri[]> callback,
                                  FileChooserParams params) {

                              fileCallback = callback;

                              Intent intent =
                                  new Intent(Intent.ACTION_OPEN_DOCUMENT);

                              intent.addCategory(
                                  Intent.CATEGORY_OPENABLE
                              );

                              intent.setType("image/*");

                              intent.putExtra(
                                  Intent.EXTRA_ALLOW_MULTIPLE,
                                  false
                              );

                              try {
                                  startActivityForResult(
                                      intent,
                                      FILE_PICKER
                                  );
                              } catch (Exception e) {
                                  fileCallback = null;
                                  return false;
                              }

                              return true;
                          }

                          @Override
                          public void onPermissionRequest(
                                  final PermissionRequest request) {

                              pendingRequest = request;

                              boolean needCamera = false;
                              boolean needMicrophone = false;

                              for (String resource :
                                      request.getResources()) {

                                  if (PermissionRequest
                                          .RESOURCE_VIDEO_CAPTURE
                                          .equals(resource)) {
                                      needCamera = true;
                                  }

                                  if (PermissionRequest
                                          .RESOURCE_AUDIO_CAPTURE
                                          .equals(resource)) {
                                      needMicrophone = true;
                                  }
                              }

                              if (android.os.Build.VERSION.SDK_INT >= 23) {

                                  java.util.ArrayList<String>
                                      permissions =
                                      new java.util.ArrayList<>();

                                  if (needCamera &&
                                      checkSelfPermission(
                                          Manifest.permission.CAMERA
                                      ) != PackageManager.PERMISSION_GRANTED) {

                                      permissions.add(
                                          Manifest.permission.CAMERA
                                      );
                                  }

                                  if (needMicrophone &&
                                      checkSelfPermission(
                                          Manifest.permission.RECORD_AUDIO
                                      ) != PackageManager.PERMISSION_GRANTED) {

                                      permissions.add(
                                          Manifest.permission.RECORD_AUDIO
                                      );
                                  }

                                  if (!permissions.isEmpty()) {

                                      requestPermissions(
                                          permissions.toArray(
                                              new String[0]
                                          ),
                                          MEDIA_PERMISSION
                                      );

                                      return;
                                  }
                              }

                              request.grant(
                                  request.getResources()
                              );
                          }
                      });

                      web.loadUrl(
                          "file:///android_asset/www/index.html"
                      );

                  } catch (Throwable e) {

                      android.widget.TextView error =
                          new android.widget.TextView(this);

                      error.setText(
                          "Connect Chat could not start.\n\n" +
                          e.getClass().getSimpleName() +
                          ": " +
                          String.valueOf(e.getMessage())
                      );

                      error.setTextColor(
                          android.graphics.Color.WHITE
                      );

                      error.setTextSize(16);

                      error.setPadding(
                          32,
                          64,
                          32,
                          32
                      );

                      error.setBackgroundColor(
                          android.graphics.Color.rgb(
                              11,
                              11,
                              15
                          )
                      );

                      setContentView(error);
                  }
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
                  );

                  if (requestCode != FILE_PICKER)
                      return;

                  if (fileCallback == null)
                      return;

                  Uri[] results = null;

                  if (resultCode == RESULT_OK &&
                      data != null) {

                      if (data.getClipData() != null) {

                          int count =
                              data.getClipData()
                                  .getItemCount();

                          if (count > 0) {

                              results = new Uri[] {
                                  data.getClipData()
                                      .getItemAt(0)
                                      .getUri()
                              };
                          }

                      } else if (data.getData() != null) {

                          results = new Uri[] {
                              data.getData()
                          };
                      }
                  }

                  fileCallback.onReceiveValue(results);
                  fileCallback = null;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] results) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      results
                  );

                  if (requestCode != MEDIA_PERMISSION)
                      return;

                  if (pendingRequest == null)
                      return;

                  boolean granted = true;

                  for (int result : results) {

                      if (result !=
                          PackageManager.PERMISSION_GRANTED) {

                          granted = false;
                          break;
                      }
                  }

                  if (granted) {

                      pendingRequest.grant(
                          pendingRequest.getResources()
                      );

                  } else {

                      pendingRequest.deny();
                  }

                  pendingRequest = null;
              }

              @Override
              public void onBackPressed() {

                  if (web != null &&
                      web.canGoBack()) {

                      web.goBack();

                  } else {

                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {

                  if (web != null) {

                      web.stopLoading();
                      web.destroy();
                      web = null;
                  }

                  super.onDestroy();
              }
          }
          JAVA

      - name: Fix Connect Chat theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/themes.xml")
          s = p.read_text()

          if 'name="Theme.ConnectChat"' not in s:
              s = s.replace(
                  '</resources>',
                  '    <style name="Theme.ConnectChat" parent="AppTheme" />\n</resources>'
              )
              p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-chat-v11-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
