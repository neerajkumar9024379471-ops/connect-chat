name: Build Connect Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q "connect-chat-v11-github-upload-ready-fixed.zip" -d /tmp/cc
          rm -rf android
          cp -r /tmp/cc/android .

      - name: Fix Connect Chat MainActivity
        run: |
          FILE=$(find android -name MainActivity.java | head -1)

          if [ -z "$FILE" ]; then
            echo "MainActivity.java not found"
            find android -type f | head -100
            exit 1
          fi

          echo "Found: $FILE"

          cat > "$FILE" <<'JAVA'
          package com.connectchat.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);

                  try {
                      web = new WebView(this);
                      web.setBackgroundColor(Color.rgb(11, 11, 15));
                      setContentView(web);

                      WebSettings s = web.getSettings();
                      s.setJavaScriptEnabled(true);
                      s.setDomStorageEnabled(true);
                      s.setAllowFileAccess(true);
                      s.setAllowContentAccess(true);
                      s.setMediaPlaybackRequiresUserGesture(false);

                      web.setWebViewClient(new WebViewClient());
                      web.setWebChromeClient(new WebChromeClient());

                      web.loadUrl("file:///android_asset/www/index.html");

                  } catch (Throwable t) {
                      android.widget.TextView error =
                              new android.widget.TextView(this);

                      error.setText(
                              "Connect Chat could not start.\n\n" +
                              t.getClass().getSimpleName() +
                              ": " + String.valueOf(t.getMessage())
                      );

                      error.setTextColor(Color.WHITE);
                      error.setTextSize(16);
                      error.setPadding(32, 64, 32, 32);
                      error.setBackgroundColor(Color.rgb(11, 11, 15));

                      setContentView(error);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.stopLoading();
                      web.destroy();
                      web = null;
                  }

                  super.onDestroy();
              }
          }
          JAVA

      - name: Fix Connect Chat theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/themes.xml")
          s = p.read_text()

          if 'name="Theme.ConnectChat"' not in s:
              s = s.replace(
                  '</resources>',
                  '    <style name="Theme.ConnectChat" parent="AppTheme" />\n</resources>'
              )
              p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-chat-v11-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
