name: Build Connect Chat APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q "connect-chat-v11-github-upload-ready-fixed.zip" -d /tmp/cc
          rm -rf android
          cp -r /tmp/cc/android .

      - name: Fix Connect Chat theme
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/res/values/themes.xml")
          s = p.read_text()

          if 'name="Theme.ConnectChat"' not in s:
              s = s.replace(
                  '</resources>',
                  '    <style name="Theme.ConnectChat" parent="AppTheme" />\n</resources>'
              )
              p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-chat-v11-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
