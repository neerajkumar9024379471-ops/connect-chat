name: Build Connect Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract V12 source
        shell: bash
        run: |
          set -e

          ZIP="connect-chat-v12-login-fixed.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found in repository"
            echo "Files available:"
            ls -la
            exit 1
          fi

          rm -rf /tmp/connect-chat
          mkdir -p /tmp/connect-chat

          unzip -q "$ZIP" -d /tmp/connect-chat

          echo "Extracted files:"
          find /tmp/connect-chat -maxdepth 3 -type f | head -100

          if [ -d "/tmp/connect-chat/android" ]; then
            echo "Android project found at /tmp/connect-chat/android"
          else
            ANDROID_DIR=$(find /tmp/connect-chat -type d -name android -print -quit)

            if [ -z "$ANDROID_DIR" ]; then
              echo "ERROR: Android project folder not found inside V12 ZIP"
              exit 1
            fi

            echo "Android project found at: $ANDROID_DIR"
            mkdir -p /tmp/connect-chat-root
            cp -r "$ANDROID_DIR" /tmp/connect-chat-root/android
            rm -rf /tmp/connect-chat/android
            cp -r /tmp/connect-chat-root/android /tmp/connect-chat/android
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build V12 APK
        working-directory: /tmp/connect-chat/android
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload V12 APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-chat-v12-login-fixed-apk
          path: /tmp/connect-chat/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
